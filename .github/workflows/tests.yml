name: Model-free checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: workspace/cog-document-classification
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogcloud-ai/cog-op-builder
          # The suite snapshot this Cog is built against (pins as of 2026-10-10).
          ref: 71834ce2f28a37cfa65e7b19a3c9de80dc688f86
          path: workspace/cog-op-builder
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.69.0
          run-install: false
      - name: Fetch the pinned suite components
        run: python3 workspace/cog-op-builder/scripts/bootstrap.py --workspace workspace
      - name: Install cog-smith and this Cog
        run: |
          pixi install --locked --manifest-path workspace/cog-smith/pixi.toml
          pixi install --locked --manifest-path workspace/cog-document-classification/pixi.toml
      - name: Run this Cog's tests and self-check
        working-directory: workspace/cog-document-classification
        run: |
          pixi run test
          pixi run check
      - name: Run Smith's package check
        working-directory: workspace/cog-smith
        run: pixi run check -- ../cog-document-classification --tests
      - name: Run the Guards
        working-directory: workspace/cog-document-classification
        run: |
          pixi run python guards/repo_guard.py
          pixi run replay -- --bundle examples/sample-bundle.json --result examples/sample-result.json > "$RUNNER_TEMP/envelope.json"
          pixi run python guards/result_guard.py --bundle examples/sample-bundle.json --envelope "$RUNNER_TEMP/envelope.json"
